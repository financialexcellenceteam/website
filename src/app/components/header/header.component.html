<header class="app-header">
  <div class="header-container">
    <div class="logo">
      <svg class="logo-image" width="38" height="38" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- White Circle -->
        <circle cx="100" cy="100" r="80" stroke="white" stroke-width="5" fill="none" />
        <!-- 3D Spinning Dollar Sign -->
        <foreignObject x="50" y="40" width="100" height="120">
          <div xmlns="http://www.w3.org/1999/xhtml"
               style="
                 width:100%;
                 height:100%;
                 display:flex;
                 align-items:center;
                 justify-content:center;
                 font-size:90px;
                 font-weight:bold;
                 color:white;
                 transform-style:preserve-3d;
                 animation: spinY 10s linear infinite;
                 perspective: 600px;
               ">
            $
          </div>
        </foreignObject>
        <!-- CSS Inside SVG -->
        <style>
          @keyframes spinY {
            0%   { transform: rotateY(0deg); }
            25%  { transform: rotateY(360deg); }
            100% { transform: rotateY(360deg); }
          }
        </style>
      </svg>
      <h2>Financial Excellence</h2>
    </div>
    <nav class="nav-buttons">
      <button 
        *ngIf="!authService.isAuthenticated()"
        (click)="openLoginModal()"
        class="nav-button"
      >
        Login
      </button>
      <button 
        *ngIf="authService.isAuthenticated()"
        (click)="logout()"
        class="nav-button logout-btn"
      >
        Logout
      </button>
    </nav>
  </div>
  
  <app-login-modal *ngIf="showLoginModal" (closeModal)="closeLoginModal()"></app-login-modal>
</header>
